<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>AgentVending 卖家帧</title>
<style>body{background:#fff;color:#111;font:14px/1.7 system-ui,"Microsoft YaHei";padding:24px;max-width:560px;margin:0 auto}
h1{font-size:18px}.p{background:#f5f7fa;border:1px solid #dde3ea;border-radius:10px;padding:14px;margin:10px 0}
.price{color:#1a7f37;font-weight:800;font-size:20px}</style></head>
<body>
<h1>🏪 AgentVending 卖家帧</h1>
<p>本帧运行在独立 origin，通过 postMessage 暴露 quote/order/status 三个 grounded capability。左侧人类看菜单，机器看消息。</p>
<div class="p">🖥️ Landing Page Build <span class="price">$180</span> · 3 天</div>
<div class="p">🤖 Browser Automation Bot <span class="price">$260</span> · 5 天</div>
<div class="p">🧠 AI Feature Integration <span class="price">$320</span> · 6 天</div>
<div class="p" style="border-style:dashed">🛍️ 智能体取货口：jsonrpc agentvending-0.2 · discover/quote/order/status</div>
<script type="module">
  import { AgentVendingAPI } from './js/agent-api.js?v=2';
  // 卖家帧自己的 origin 是 127.0.0.1:8900 —— 资源同源拉取，能力经 postMessage 暴露给父页
  const api = new AgentVendingAPI(location.origin);
  await api.discover().catch(() => {});
  api.serveViaPostMessage('*');
  window.parent.postMessage({ jsonrpc: 'agentvending-0.2', ready: true }, '*');
  document.title = '卖家帧就绪';
</script>
</body>
</html>
