<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentVending — 跨站点双智能体交易演示</title>
<style>
  :root { --bg:#0d1117; --card:#161b22; --line:#30363d; --txt:#e6edf3; --dim:#8b949e; --acc:#3fb950; --acc2:#58a6ff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--txt); font-family:ui-sans-serif,system-ui,"Microsoft YaHei"; }
  .wrap { max-width:1100px; margin:0 auto; padding:32px 24px; }
  h1 { font-size:1.5rem; margin-bottom:4px; }
  .sub { color:var(--dim); margin-bottom:20px; font-size:.95rem; }
  .panes { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .pane { border:1px solid var(--line); border-radius:12px; overflow:hidden; background:var(--card); }
  .pane h2 { font-size:.85rem; padding:10px 14px; border-bottom:1px solid var(--line); color:var(--acc2); }
  .pane iframe { width:100%; height:420px; border:0; background:#fff; }
  #buyerLog { height:420px; overflow:auto; padding:14px; font:12px/1.7 ui-monospace,monospace; }
  .row { display:flex; gap:10px; padding:3px 0; border-bottom:1px solid #1a2129; }
  .t { color:var(--dim); min-width:46px; } .s { color:var(--acc2); min-width:120px; }
  button { background:var(--acc); border:0; color:#04260b; font-weight:700; font-size:1rem; padding:12px 30px; border-radius:10px; cursor:pointer; margin-top:16px; font-family:inherit; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  .note { color:var(--dim); font-size:.8rem; margin-top:10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>跨站点双智能体交易（postMessage 通道）</h1>
  <p class="sub">左：卖家售货机（独立 origin 帧内运行 AgentVendingAPI.serveViaPostMessage） · 右：买家智能体（另一"站点"的逻辑页）。两个窗口互不共享 JS 上下文，只通过结构化消息通信——复现真实跨站点智能体交易。</p>
  <div class="panes">
    <div class="pane"><h2 id="sellerTitle">🏪 卖家：AgentVending 售货机（iframe）</h2><iframe id="sellerFrame"></iframe></div>
    <div class="pane"><h2>🤖 买家智能体交易日志</h2><div id="buyerLog"><div class="row"><span class="t">--</span><span class="s">等待运行</span></div></div></div>
  </div>
  <button id="run">▶ 运行跨站点买家智能体</button>
  <p class="note">预算 $200，目标 SKU browser-automation（$260）→ 触发预算守卫与自动谈判，与单站点演示相同剧本，但走 postMessage 跨帧通道。</p>
</div>
<script type="module">
  const logEl = document.getElementById('buyerLog');
  const btn = document.getElementById('run');
  function onLog({ t, step, detail }) {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `<span class="t">+${t}</span><span class="s">${step}</span><span>${detail}</span>`;
    logEl.appendChild(row);
    logEl.scrollTop = logEl.scrollHeight;
  }

  // 买家侧客户端（与 agent-api.js 的 AgentVendingAPI.client 相同协议）
  // 本地：买家 :8900 / 卖家 :8899（真·双 origin）
  // GitHub Pages 等单 origin 部署：卖家帧退化为同源（消息协议照常演示，控制台会注明）
  const frame = document.getElementById('sellerFrame');
  const isLocal = ['localhost', '127.0.0.1'].includes(location.hostname);
  const BASE = location.origin + (isLocal ? '' : location.pathname.replace(/[^/]*$/, ''));
  const SELLER_ORIGIN = location.origin;
  const SELLER_BASE = isLocal ? 'http://127.0.0.1:8899' : BASE;
  frame.src = SELLER_BASE + '/seller_frame.html?v=' + Date.now();
  document.getElementById('sellerTitle').textContent = `🏪 卖家：AgentVending 售货机（iframe${isLocal ? ' · :8899 跨源' : ' · 同源部署模式'})`;
  let seq = 0; const pending = new Map();
  let sellerReadyResolve = null;
  const sellerReady = new Promise(r => { sellerReadyResolve = r; });
  window.addEventListener('message', (ev) => {
    if (ev.origin !== SELLER_ORIGIN) return;
    const { jsonrpc, id, result, ready } = ev.data || {};
    if (jsonrpc === 'agentvending-0.2' && ready && sellerReadyResolve) { sellerReadyResolve(); sellerReadyResolve = null; }
    if (jsonrpc === 'agentvending-0.2' && pending.has(id)) { pending.get(id)(result); pending.delete(id); }
  });
  const call = (method, params, retries = 0) => new Promise((resolve) => {
    const id = ++seq;
    pending.set(id, resolve);
    frame.contentWindow.postMessage({ jsonrpc: 'agentvending-0.2', id, method, params }, SELLER_ORIGIN);
    if (retries > 0) setTimeout(async () => {
      if (pending.has(id)) { // 无响应则重发
        pending.delete(id);
        resolve(await call(method, params, retries - 1));
      }
    }, 1200);
  });

  btn.addEventListener('click', async () => {
    btn.disabled = true;
    logEl.innerHTML = '';
    const t0 = Date.now();
    const log = (step, detail) => onLog({ t: ((Date.now() - t0) / 1000).toFixed(1) + 's', step, detail });

    log('handshake', '等待卖家帧就绪（seller_frame.html 加载 AgentVendingAPI）…');
    await Promise.race([sellerReady, new Promise(r => setTimeout(r, 6000))]);
    log('discover', 'POST postMessage → discovery 查询');
    const desc = await call('discover', {}, 3);
    log('discovered', `seller="${(desc.name || '').slice(0, 44)}", capabilities=[${(desc.capabilities || []).map(c => c.id).join(', ')}]`);

    log('quote', 'asking sku=browser-automation');
    const q = await call('quote', { sku: 'browser-automation' });
    log('quoted', `$${q.price_usd} · ${q.delivery_days} days (${q.quote_id})`);

    if (q.price_usd > 200) {
      log('budget-guard', `$${q.price_usd} > $200 → counter-offer`);
      const alt = await call('quote', { sku: 'landing-page' });
      log('counter-quote', `$${alt.price_usd} — ${alt.price_usd <= 200 ? 'ACCEPT' : 'DECLINE'}`);
      Object.assign(q, alt);
    }
    log('order', 'placing order (budget guard $200)');
    const o = await call('order', { quote_id: q.quote_id, buyer_agent_id: 'cross-site-buyer', max_budget_usd: 200, brief_url: SELLER_ORIGIN + '/brief.md' });
    log(o.status === 'accepted' ? 'ordered ✅' : 'rejected', `status=${o.status}${o.order_id ? ' id=' + o.order_id : ''}`);
    if (o.order_id) {
      const s = await call('status', { order_id: o.order_id });
      log('status', `progress ${s.progress_pct}%`);
    }
    log('done', `total ${(Date.now() - t0) / 1000}s — cross-origin deal, zero human input`);
    btn.disabled = false;
    btn.textContent = '↻ 再跑一次';
  });
</script>
</body>
</html>
